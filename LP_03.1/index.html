<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar Nombre</title>
    <link rel="stylesheet" href="CSS/estilos.css">
</head>
<body>
    <main class="contenedor">
        <h1>Agregar nombre</h1>
        <p>Escribe un nombre y presiona "Agregar". No se permiten nombres en blanco.</p>

        <div class="formulario">
            <input id="nombreInput" type="text" placeholder="Ingresa el nombre" aria-label="Nombre">
            <button id="agregarBtn" type="button">Agregar</button>
        </div>

        <section class="lista">
            <h2>Elementos agregados</h2>
            <ul id="listaNombres"></ul>
        </section>
    </main>

    <script src="JS/script.js"></script>
</body>
</html>
